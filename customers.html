{% extends "base.html" %}
{% block title %}Customers — My Bank{% endblock %}
{% block content %}
<div class="grid">
  <section class="card">
    <h2>Register customer</h2>
    <form method="post">
      <label>Name</label>
      <input name="name" required>
      <label>Email</label>
      <input name="email" type="email" required>
      <label>Phone</label>
      <input name="phone" required>
      <button type="submit">Register</button>
    </form>
  </section>
  <section class="card">
    <h2>All customers</h2>
    <table>
      <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th></tr>
      {% for c in customers %}
      <tr>
        <td>{{ c.customer_id }}</td>
        <td>{{ c.name }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4">No customers yet.</td></tr>
      {% endfor %}
    </table>
  </section>
</div>
{% endblock %}
